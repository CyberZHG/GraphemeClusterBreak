[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "grapheme-cluster-break"
version = "1.0.0"
description = "A library for segmenting grapheme clusters."
requires-python = ">=3.8"
readme = "python/README.md"
license = { text = "MIT" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/CyberZHG/GraphemeClusterBreak"
Repository = "https://github.com/CyberZHG/GraphemeClusterBreak"
Issues = "https://github.com/CyberZHG/GraphemeClusterBreak/issues"

[tool.scikit-build]
build-dir = "../cmake-build-python/{wheel_tag}"
build.verbose = true

[tool.scikit-build.cmake.define]
GRAPHEME_CLUSTER_BREAK_BIND_PYTHON = "ON"

[tool.scikit-build.sdist]
exclude = [
    ".github",
    ".gitignore",
    "demo",
    "docs",
    "tests",
    "wasm",
]


[project.optional-dependencies]
test = [
    "pytest",
    "black",
    "isort",
    "flake8",
]